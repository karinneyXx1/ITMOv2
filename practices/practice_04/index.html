<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race Mini</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    h1 {
      font-size: 2em;
      font-weight: 900;
      margin: 0;
    }
    #gameCanvas {
      border: 3px solid #fff;
      background: #1a1a1a;
      box-shadow: 8px 8px 0 #fff;
    }
    .controls {
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }
    .stats {
      display: flex;
      gap: 30px;
      font-size: 16px;
      font-weight: 600;
    }
    .stat-label {
      color: #999;
    }
    .console-output {
      width: 800px;
      max-height: 150px;
      overflow-y: auto;
      background: #1a1a1a;
      border: 2px solid #fff;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #0f0;
    }
    .console-output div {
      margin: 2px 0;
    }
    .error {
      color: #f00;
    }
  </style>
</head>
<body>
  <h1>RACE MINI</h1>
  
  <div class="stats">
    <div><span class="stat-label">Speed:</span> <span id="speedDisplay">0</span></div>
    <div><span class="stat-label">Angle:</span> <span id="angleDisplay">0</span>°</div>
    <div><span class="stat-label">Position:</span> <span id="posDisplay">0, 0</span></div>
  </div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>
  
  <div class="controls">
    <strong>Controls:</strong><br>
    ↑ Accelerate | ↓ Brake | ← Turn Left | → Turn Right<br>
    Open browser console and try: <code>window.testInvalidCommand()</code>
  </div>

  <div class="console-output" id="console"></div>

  <script src="game.js"></script>
  <script>
    // === Игровое состояние ===
    let gameState = createInitialState();
    let currentCommand = 'none';

    // === Canvas setup ===
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // === Console log ===
    function log(message, isError = false) {
      const consoleDiv = document.getElementById('console');
      const entry = document.createElement('div');
      if (isError) entry.className = 'error';
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      consoleDiv.appendChild(entry);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    // === Keyboard input ===
    const keyMap = {
      'ArrowUp': 'accelerate',
      'ArrowDown': 'brake',
      'ArrowLeft': 'left',
      'ArrowRight': 'right'
    };

    document.addEventListener('keydown', (e) => {
      if (keyMap[e.key]) {
        e.preventDefault();
        currentCommand = keyMap[e.key];
      }
    });

    document.addEventListener('keyup', (e) => {
      if (keyMap[e.key]) {
        e.preventDefault();
        currentCommand = 'none';
      }
    });

    // === Game loop ===
    function gameLoop() {
      try {
        // Применяем команду игрока
        gameState = applyMove(gameState, currentCommand);
        
        // Обновляем физику
        gameState = updatePhysics(gameState);

        // Рендерим
        render();
        
        // Обновляем UI
        updateStats();
      } catch (error) {
        log(`ERROR: ${error.message}`, true);
        console.error(error);
      }

      requestAnimationFrame(gameLoop);
    }

    // === Rendering ===
    function render() {
      const { player } = gameState;

      // Очистка
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Сетка
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Игрок (треугольник)
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate((player.angle * Math.PI) / 180);

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(-12, 12);
      ctx.lineTo(12, 12);
      ctx.closePath();
      ctx.fill();

      // Скорость (визуализация)
      if (player.speed > 0) {
        ctx.strokeStyle = '#0ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 12);
        ctx.lineTo(0, 12 + player.speed * 3);
        ctx.stroke();
      }

      ctx.restore();
    }

    // === Stats update ===
    function updateStats() {
      const { player } = gameState;
      document.getElementById('speedDisplay').textContent = player.speed.toFixed(1);
      document.getElementById('angleDisplay').textContent = player.angle.toFixed(0);
      document.getElementById('posDisplay').textContent = 
        `${Math.round(player.x)}, ${Math.round(player.y)}`;
    }

    // === Test invalid command (для проверки через консоль) ===
    window.testInvalidCommand = function() {
      try {
        validateMove('fly');
        log('❌ Validation should have thrown an error!', true);
      } catch (error) {
        log(`✅ Validation correctly rejected: ${error.message}`);
      }
    };

    // === Start ===
    log('Game started. Use arrow keys to control the car.');
    log('Current MAX_SPEED: ' + MAX_SPEED);
    gameLoop();
  </script>
</body>
</html>
